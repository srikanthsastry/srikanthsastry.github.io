<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  
  <!-- Spec Layer Box -->
  <rect x="20" y="20" width="680" height="160" rx="6" fill="#f8f9fa" stroke="#2d2d2d" stroke-width="2"/>
  <text x="360" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#2d2d2d" letter-spacing="1.5">SPEC LAYER (SDD)</text>
  
  <!-- Spec flow -->
  <rect x="60" y="72" width="80" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" font-size="12" fill="#2d2d2d">Human</text>
  
  <line x1="140" y1="90" x2="175" y2="90" stroke="#2d2d2d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="180" y="72" width="80" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="220" y="95" text-anchor="middle" font-size="12" fill="#2d2d2d">Spec</text>
  
  <line x1="260" y1="90" x2="295" y2="90" stroke="#2d2d2d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="300" y="72" width="140" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="370" y="95" text-anchor="middle" font-size="12" fill="#2d2d2d">Behavioral Tests</text>
  
  <line x1="440" y1="90" x2="485" y2="90" stroke="#2d2d2d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="490" y="72" width="80" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="530" y="95" text-anchor="middle" font-size="12" fill="#2d2d2d">Pass?</text>
  
  <!-- Refine loop arrow -->
  <path d="M530 108 L530 130 L100 130 L100 108" fill="none" stroke="#2d2d2d" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="315" y="146" text-anchor="middle" font-size="11" fill="#666" font-style="italic">refine spec</text>
  
  <text x="360" y="172" text-anchor="middle" font-size="11" fill="#666">"Does this code do what the spec says?"</text>
  
  <!-- Orphaned Architecture Box -->
  <rect x="160" y="210" width="400" height="100" rx="6" fill="#fff3f3" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="360" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#c0392b">ARCHITECTURE</text>
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#888">Too low for the spec.</text>
  <text x="360" y="278" text-anchor="middle" font-size="11" fill="#888">Too high for the agent.</text>
  <text x="360" y="298" text-anchor="middle" font-size="12" font-weight="500" fill="#c0392b">No enforcement pipeline.</text>
  
  <!-- Implementation Layer Box -->
  <rect x="20" y="340" width="680" height="160" rx="6" fill="#f8f9fa" stroke="#2d2d2d" stroke-width="2"/>
  <text x="360" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#2d2d2d" letter-spacing="1.5">IMPLEMENTATION LAYER (missing)</text>
  
  <!-- Implementation flow -->
  <rect x="60" y="392" width="80" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="100" y="415" text-anchor="middle" font-size="12" fill="#2d2d2d">Architect</text>
  
  <line x1="140" y1="410" x2="175" y2="410" stroke="#2d2d2d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="180" y="392" width="180" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="270" y="415" text-anchor="middle" font-size="12" fill="#2d2d2d">Coherence Tests</text>
  
  <line x1="360" y1="410" x2="395" y2="410" stroke="#2d2d2d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="400" y="392" width="170" height="36" rx="4" fill="white" stroke="#2d2d2d" stroke-width="1.5"/>
  <text x="485" y="409" text-anchor="middle" font-size="10" fill="#888">structural guardrails</text>
  <text x="485" y="423" text-anchor="middle" font-size="12" fill="#2d2d2d">Pass?</text>
  
  <text x="360" y="462" text-anchor="middle" font-size="11" fill="#666">"Does this code respect the system's architectural constraints?"</text>
  
  <!-- Connectors: broken lines from architecture to both layers -->
  <line x1="360" y1="180" x2="360" y2="210" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="360" y1="310" x2="360" y2="340" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d2d2d"/>
    </marker>
  </defs>
</svg>
