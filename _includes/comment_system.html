<!-- Giscus Comments -->
<!-- Prerequisites:
     1. Enable Discussions on your repo (Settings > Features > Discussions)
     2. Create a "Comments" category with Announcements type
     3. Install giscus app: https://github.com/apps/giscus
     4. Get repo-id and category-id from https://giscus.app
     5. Fill in data-repo-id and data-category-id below
-->
{% if page.comments != false %}
<div class="mt-10 pt-10 border-t border-neutral-200 dark:border-neutral-700">
  <h2 class="text-xl font-bold mb-6 text-neutral-900 dark:text-neutral-100">Comments</h2>
  <script src="https://giscus.app/client.js"
          data-repo="srikanthsastry/srikanthsastry.github.io"
          data-repo-id="R_kgDOG4l6jA"
          data-category="Comments"
          data-category-id="DIC_kwDOG4l6jM4C73sw"
          data-mapping="pathname"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</div>
{% endif %}
