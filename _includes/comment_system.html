<!-- Giscus Comments -->
<!-- Prerequisites:
     1. Enable Discussions on your repo (Settings > Features > Discussions)
     2. Create a "Comments" category with Announcements type
     3. Install giscus app: https://github.com/apps/giscus
     4. Get repo-id and category-id from https://giscus.app
     5. Fill in data-repo-id and data-category-id below
-->
{% if page.comments != false %}
<div class="mt-10 pt-10 border-t border-neutral-200 dark:border-neutral-700">
  <h2 class="text-xl font-bold mb-6 text-neutral-900 dark:text-neutral-100">Comments</h2>
  <script>
    (function() {
      var baseUrl = 'https://srikanth.sastry.name/assets/css/';
      var lightTheme = baseUrl + 'giscus-light.css';
      var darkTheme  = baseUrl + 'giscus-dark.css';

      function isDark() {
        return document.documentElement.classList.contains('dark');
      }

      // Write the giscus script tag with the correct initial theme
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.setAttribute('data-repo', 'srikanthsastry/srikanthsastry.github.io');
      s.setAttribute('data-repo-id', 'R_kgDOG4l6jA');
      s.setAttribute('data-category', 'Comments');
      s.setAttribute('data-category-id', 'DIC_kwDOG4l6jM4C73sw');
      s.setAttribute('data-mapping', 'pathname');
      s.setAttribute('data-strict', '1');
      s.setAttribute('data-reactions-enabled', '1');
      s.setAttribute('data-emit-metadata', '0');
      s.setAttribute('data-input-position', 'top');
      s.setAttribute('data-theme', isDark() ? darkTheme : lightTheme);
      s.setAttribute('data-lang', 'en');
      s.setAttribute('data-loading', 'lazy');
      s.setAttribute('crossorigin', 'anonymous');
      s.async = true;
      document.currentScript.parentElement.appendChild(s);

      // Watch for theme toggle changes on <html> class
      var observer = new MutationObserver(function() {
        var iframe = document.querySelector('iframe.giscus-frame');
        if (!iframe) return;
        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: isDark() ? darkTheme : lightTheme } } },
          'https://giscus.app'
        );
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
</div>
{% endif %}
